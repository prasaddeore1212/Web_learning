
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }

        .container {
            background: white;
            padding: 30px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        p {
            text-align: center;
            margin-top: 15px;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Sign Up</h2>

        <form action="#" method="post">

            <label for="firstName">First Name</label>
            <input
                type="text"
                id="firstName"
                name="firstName"
                placeholder="Enter first name"
                pattern="[A-Za-z ]{2,30}"
                title="Enter 2 to 30 letters and spaces only"
                autocomplete="given-name"
                required
            >

            <label for="lastName">Last Name</label>
            <input
                type="text"
                id="lastName"
                name="lastName"
                placeholder="Enter last name"
                pattern="[A-Za-z ]{2,30}"
                title="Enter 2 to 30 letters and spaces only"
                autocomplete="family-name"
                required
            >

            <label for="dob">Date of Birth</label>
            <input
                type="date"
                id="dob"
                name="dob"
                required
            >

            <label for="age">Age</label>
            <input
                type="number"
                id="age"
                name="age"
                placeholder="Enter age"
                min="1"
                max="120"
                required
            >

            <button type="submit">Submit</button>

            <p>
                Already have an account?
                <a href="signin.html">Sign In</a>
            </p>

        </form>
    </div>

    <script>
        // Prevent selecting a future date of birth.
        const dob = document.getElementById("dob");

        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const day = String(today.getDate()).padStart(2, "0");

        dob.max = `${year}-${month}-${day}`;
    </script>

</body>
</html>
